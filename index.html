<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Backtest BTC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="appbar">
  <div class="wrap">
    <h1>Backtest <small id="dsLabel">No data</small></h1>
  </div>
</header>

<main class="wrap">
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ============================== DATA -->
  <section class="tab" id="tab-data">
    <div class="card">
      <h2>Download</h2>
      <div class="grid2">
        <label>Market
          <select id="dlMarket">
            <option value="futures">Futures</option>
            <option value="spot">Spot</option>
          </select>
        </label>
        <label>Symbol <input id="dlSymbol" value="BTCUSDT" autocapitalize="characters" spellcheck="false"></label>
        <label>Timeframe
          <select id="dlTf">
            <option value="1m">1m</option>
            <option value="5m" selected>5m</option>
            <option value="15m">15m</option>
            <option value="1h">1h</option>
          </select>
        </label>
        <label>From <input type="date" id="dlFrom" value="2021-01-01"></label>
      </div>
      <p class="hint" id="dlHint"></p>
      <div class="progress hidden" id="dlProg"><i></i></div>
      <p class="hint" id="dlStatus"></p>
      <div class="row">
        <button class="btn primary grow" id="btnDownload" type="button">Download</button>
        <button class="btn" id="btnCancel" type="button" hidden>Stop</button>
        <button class="btn" id="btnTest" type="button">Test</button>
      </div>
      <details class="more">
        <summary>Advanced</summary>
        <label>Proxy URL <input id="apiBase" placeholder="optional" spellcheck="false"></label>
        <div class="grid3">
          <label>CSV market
            <select id="csvMarket"><option value="futures">Futures</option><option value="spot">Spot</option></select>
          </label>
          <label>Symbol <input id="csvSymbol" value="BTCUSDT"></label>
          <label>TF
            <select id="csvTf"><option>1m</option><option selected>5m</option><option>15m</option><option>1h</option></select>
          </label>
        </div>
        <label class="btn sm file">Import CSV<input type="file" id="csvFile" accept=".csv,text/csv,text/plain"></label>
      </details>
    </div>

    <div class="card">
      <h2>Saved <span class="hint" id="storageInfo"></span></h2>
      <div id="dsList" class="list"></div>
    </div>
  </section>

  <!-- ============================== STRATEGY -->
  <section class="tab" id="tab-strategy" hidden>
    <div class="card">
      <div class="grid2">
        <label>Name <input id="stName"></label>
        <label>Load <select id="stPick"></select></label>
      </div>
      <div class="row">
        <label class="inline">TF <select id="stTf"></select></label>
        <div class="seg">
          <button id="btnSave" type="button">Save</button>
          <button id="btnExport" type="button">Export</button>
          <label class="file">Import<input type="file" id="importJson" accept=".json,application/json"></label>
          <button id="btnDelete" type="button" class="danger">Delete</button>
        </div>
      </div>
      <p class="hint warn" id="tfNote"></p>
    </div>

    <div class="card">
      <h2><span class="up">Long</span> <span class="tag">AND</span></h2>
      <div id="condLong" class="conds"></div>
      <button class="btn sm ghost" data-add="long" type="button">+ Add</button>
    </div>
    <div class="card">
      <h2><span class="down">Short</span> <span class="tag">AND</span></h2>
      <div id="condShort" class="conds"></div>
      <button class="btn sm ghost" data-add="short" type="button">+ Add</button>
    </div>

    <div class="card">
      <h2>Exit &amp; risk</h2>
      <div class="grid2" id="exitFields"></div>
    </div>
  </section>

  <!-- ============================== RESULTS -->
  <section class="tab" id="tab-result" hidden>
    <div class="card">
      <div class="grid2">
        <label>From <input type="date" id="rFrom"></label>
        <label>To <input type="date" id="rTo"></label>
        <label>Split <input type="date" id="rSplit" value="2025-01-01"></label>
      </div>
      <div id="attemptWarn"></div>
    </div>
    <div class="card" id="resBox" hidden>
      <p class="hint" id="resMeta"></p>
      <div class="tablewrap"><table id="resPeriods"></table></div>
      <svg id="eqChart" class="eq" viewBox="0 0 600 160" preserveAspectRatio="none" role="img" aria-label="Equity curve"></svg>
      <div class="tablewrap"><table id="resYears"></table></div>
      <p class="chips" id="resExits"></p>
      <details class="more"><summary>Trades</summary><div class="tablewrap"><table id="resTrades"></table></div></details>
    </div>
  </section>
</main>

<nav class="tabbar" aria-label="Tabs">
  <div class="wrap">
    <button type="button" data-tab="data" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
      <span>Data</span>
    </button>
    <button type="button" data-tab="strategy">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>Strategy</span>
    </button>
    <button type="button" data-tab="result">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>
      <span>Results</span>
    </button>
    <button type="button" class="run" id="btnRun">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg>
      <span>Run</span>
    </button>
  </div>
</nav>

<template id="condTpl">
  <div class="cond">
    <div class="condhead">
      <select class="c-ind" aria-label="Indicator"></select>
      <button class="icon c-del" type="button" aria-label="Remove">✕</button>
    </div>
    <div class="cgrid">
      <span class="c-params"></span>
      <label>TF <select class="c-tf"></select></label>
      <label>Op <select class="c-op"></select></label>
      <label>Value <input type="number" class="c-val" step="any" inputmode="decimal"></label>
    </div>
    <input type="range" class="c-range" aria-label="Value">
  </div>
</template>

<script type="module" src="js/app.js"></script>

<!-- Vercel Web Analytics -->
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
