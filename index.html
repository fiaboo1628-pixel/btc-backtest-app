<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bot">
<title>Bot giao dịch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#view">Bỏ qua điều hướng</a>
<header class="appbar">
  <div class="wrap">
    <h1 id="pageTitle">Tổng quan</h1>
    <span class="pill" id="modePill" hidden></span>
  </div>
  <div id="netBanner" class="banner" role="status" aria-live="polite" hidden></div>
</header>

<main class="wrap" id="view" tabindex="-1" aria-live="polite"></main>

<nav id="tabbar" class="tabbar" aria-label="Màn hình">
  <div class="wrap">
    <a href="#overview" data-view="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Tổng quan</span></a>
    <a href="#trades" data-view="trades"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Lệnh</span></a>
    <a href="#backtest" data-view="backtest"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-6 4 4 7-9"/><path d="M4 21h16"/></svg><span>Backtest</span></a>
    <a href="#data" data-view="data"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>Dữ liệu</span></a>
    <a href="#alerts" data-view="alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><span>Cảnh báo</span></a>
  </div>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<dialog id="confirm" aria-labelledby="confirmTitle">
  <h3 id="confirmTitle"></h3>
  <div id="confirmBody" class="dialog-body"></div>
  <div class="dialog-actions">
    <button class="btn" id="confirmNo" type="button">Huỷ</button>
    <button class="btn primary" id="confirmYes" type="button">Đồng ý</button>
  </div>
</dialog>

<footer class="wrap foot"><span id="user"></span> <span>Phiên bản <span id="version"></span></span></footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
