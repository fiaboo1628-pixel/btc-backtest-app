# Kiểm tra độ bền DonchianRevert trên dữ liệu Binance USDT-M perpetual thật (data.binance.vision):
# baseline, walk-forward, độ nhạy tham số, chi phí xấu, coin khác, Monte Carlo. Không sửa chiến lược.
# Kết quả: tab Summary của lần chạy + artifact robustness (result.md, result.json).
name: robustness

on:
  workflow_dispatch:
    inputs:
      coins:
        description: "Coin (BTC phải đứng đầu)"
        default: "BTC ETH SOL BNB"
      start:
        description: "Tháng đầu tải dữ liệu"
        default: "2020-01"
  push:
    branches: ["claude/**", "research/**"]
    paths: ["bot/research/robustness.py", "bot/research/fastsim.py", ".github/workflows/robustness.yml"]

jobs:
  robustness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    timeout-minutes: 300
    env:
      COINS: ${{ inputs.coins || 'BTC ETH SOL BNB' }}
      START: ${{ inputs.start || '2020-01' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/robustness.yml
      - name: Cài freqtrade (cùng bản bot đang chạy) + numba
        run: pip install -q freqtrade==2026.8 numba
      - name: Tải nến 1m + 15m, mark, funding (data.binance.vision)
        run: |
          END=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)
          python research/binance_vision.py --pairs $COINS --tf 1m 15m --start $START --end $END --out data/binance
      - name: Dữ liệu Bitstamp cũ (để so với Binance)
        run: git clone -q --depth 1 https://github.com/ff137/bitstamp-btcusd-minute-data.git /tmp/bitstamp
      - name: Kiểm tra độ bền
        run: python research/robustness.py --datadir data/binance --bitstamp /tmp/bitstamp --coins $COINS --out robustness_out --ft-workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robustness
          path: |
            bot/robustness_out/result.md
            bot/robustness_out/result.json
