# Bộ paper trading (dry-run) cho DonchianRevert — xem README.md cùng thư mục.
#   docker compose run --rm setup     # lần đầu: tạo mật khẩu, tải dữ liệu
#   docker compose up -d              # chạy bot + LAB + hub (app, tab Live, Chỉnh tham số) ở cổng 8090
# Mọi cổng chỉ mở trên 127.0.0.1 của máy; truy cập từ xa qua Tailscale (README).

x-ft: &ft
  # Ghim phiên bản: bot đặt lệnh tiền thật trên engine này, và chế độ Demo dựa vào ghi đè _ft_has nội bộ.
  # Nâng cấp: đổi tag → docker compose up -d → chạy Demo + `docker compose run --rm check` → rồi mới dùng tiền thật.
  image: freqtradeorg/freqtrade:2026.8
  restart: unless-stopped
  volumes:
    - "../user_data:/freqtrade/user_data"
    - "./:/deploy"

services:
  live:
    <<: *ft
    container_name: donchian-live
    ports: ["127.0.0.1:8080:8080"]          # FreqUI + API của bot (dry-run; có .env từ setup --api thì vào lệnh trên sàn)
    command: >
      trade
      --logfile /freqtrade/user_data/logs/live.log
      --db-url sqlite:////freqtrade/user_data/${BOT_DB:-dryrun}.sqlite
      -c /deploy/config.base.json -c /deploy/config.live.json -c /deploy/secrets/live.json
      ${BOT_EXTRA_CONFIG:-}

  paper:                                    # luôn dry-run trên nến sàn THẬT (không key) — so tín hiệu với backtest
    <<: *ft                                 # (bot live ở chế độ Demo lấy nến demo-fapi, khác sàn thật)
    container_name: donchian-paper
    ports: ["127.0.0.1:8082:8082"]
    command: >
      trade
      --logfile /freqtrade/user_data/logs/paper.log
      --db-url sqlite:////freqtrade/user_data/paper.sqlite
      -c /deploy/config.base.json -c /deploy/config.live.json -c /deploy/config.paper.json
      -c /deploy/secrets/paper.json

  lab:
    <<: *ft
    container_name: donchian-lab
    ports: ["127.0.0.1:8081:8081"]
    command: >
      webserver
      --logfile /freqtrade/user_data/logs/lab.log
      -c /deploy/config.base.json -c /deploy/config.lab.json -c /deploy/secrets/lab.json

  hub:                                      # app backtest + tab Live + Chỉnh tham số + nến trên máy chủ, cổng 8090
    <<: *ft
    container_name: donchian-hub
    ports: ["127.0.0.1:8090:8090"]
    volumes:
      - "../user_data:/freqtrade/user_data"
      - "./:/deploy"
      - "../hub:/hub:ro"
      - "../..:/app:ro"                       # mã app; hub chỉ phục vụ index.html, js/, css/... (xem hub/server.py)
    entrypoint: ["python", "/hub/server.py"]
    command: ["-c", "/deploy/hub.json"]
    depends_on: [live, lab]

  setup:
    <<: *ft
    restart: "no"
    profiles: ["setup"]
    entrypoint: ["python", "/deploy/setup.py"]
    command: []

  check:                                    # kiểm tra end-to-end trên Binance Demo: docker compose run --rm check
    <<: *ft
    restart: "no"
    profiles: ["setup"]
    entrypoint: ["python", "/deploy/demo_check.py"]
    command: []
